<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Your lokl sign-in code</title></head>
<body style="margin:0;padding:0;background:#ffffff">
<div style="max-width:560px;margin:0 auto;padding:24px 16px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.5;color:#111111">
<p style="margin:0 0 24px;font-size:20px;font-weight:600">lokl</p>
<h1 style="margin:0 0 8px;font-size:22px;line-height:1.3">Your sign-in code</h1>
<p style="margin:0 0 16px;font-size:36px;font-weight:700;letter-spacing:8px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">{{ .Token }}</p>
<p style="margin:0 0 24px">Enter this code on lokl to sign in. It works for 10 minutes.</p>
<p style="margin:0 0 8px">Or sign in with this link, in the browser where you asked for the code:</p>
<p style="margin:0 0 24px"><a href="{{ .ConfirmationURL }}" style="display:inline-block;min-height:44px;line-height:44px;padding:0 20px;background:#111111;color:#ffffff;text-decoration:none;border-radius:6px;font-weight:600">Sign in to lokl</a></p>
<p style="margin:0;font-size:14px;color:#555555">If you didn't ask to sign in, you can ignore this email.</p>
</div>
</body>
</html>
