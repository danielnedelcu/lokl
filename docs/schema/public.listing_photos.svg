<text text-anchor="start" x="53.2" y="-1178.8" font-family="Arial" font-size="14.00" fill="#333333">Photos of a listing, at most 8. Position 0 is the cover. At least one is required before a listing is published or submitted. Removed by the provider (not while submitted or unpublished, and never the last one of a live listing) or by the admin; rows go with their listing. Removing a row leaves the stored file.</text>
