<text text-anchor="start" x="145.15" y="-332.6" font-family="Arial" font-size="14.00"> The login that owns and manages this provider. A user is a provider exactly when they own a row here. The login cannot be deleted while it owns a provider: suspend or anonymize the provider first.</text>
