<text text-anchor="start" x="276.5" y="-996.8" font-family="Arial" font-size="14.00"> When the session starts. Entered and shown in the listing city&#39;s time zone (cities.timezone). Must be in the future and at most a year ahead when a provider adds or moves it.</text>
