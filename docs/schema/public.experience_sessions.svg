<text text-anchor="start" x="53.2" y="-1086.4" font-family="Arial" font-size="14.00" fill="#333333">Dated sessions of an Experience, each with a number of spots. Providers add and change future sessions (not while the listing is submitted or unpublished); a session that has started is kept as it is. Deleted with their listing, or by the provider before they start; once bookings exist, a session with bookings is cancelled instead.</text>
