<text text-anchor="start" x="50.2" y="-453" font-family="Arial" font-size="14.00" fill="#333333">One row per scheduled job: how often it should run, and how its latest runs went (every run, quiet ones included). The watchdog reads it. Written by job_start() and job_finish(); never deleted.</text>
