<polygon fill="none" stroke="black" points="46.2,-1015.4 46.2,-1046.2 2093.51,-1046.2 2093.51,-1015.4 46.2,-1015.4"/>
<text text-anchor="start" x="53.2" y="-1027.6" font-family="Arial" font-size="14.00">on_date </text>
<text text-anchor="start" x="107.7" y="-1027.6" font-family="Arial" font-size="14.00" fill="#666666">[date]</text>
<polygon fill="none" stroke="black" points="46.2,-984.6 46.2,-1015.4 2093.51,-1015.4 2093.51,-984.6 46.2,-984.6"/>
<text text-anchor="start" x="53.2" y="-996.8" font-family="Arial" font-size="14.00">first_at </text>
<text text-anchor="start" x="99.1" y="-996.8" font-family="Arial" font-size="14.00" fill="#666666">[timestamp with time zone]</text>
<polygon fill="none" stroke="black" points="46.2,-953.8 46.2,-984.6 2093.51,-984.6 2093.51,-953.8 46.2,-953.8"/>
<text text-anchor="start" x="53.2" y="-966" font-family="Arial" font-size="14.00">last_at </text>
<text text-anchor="start" x="98.34" y="-966" font-family="Arial" font-size="14.00" fill="#666666">[timestamp with time zone]</text>
<text text-anchor="start" x="264.06" y="-966" font-family="Arial" font-size="14.00"> The day&#39;s last bookable time when refreshed. Search checks it against now plus the notice, so a day whose times have all come within the notice no longer matches.</text>
<polygon fill="none" stroke="black" points="46.2,-923 46.2,-953.8 2093.51,-953.8 2093.51,-923 46.2,-923"/>
<text text-anchor="start" x="53.2" y="-935.2" font-family="Arial" font-size="14.00">starts </text>
<text text-anchor="start" x="91.32" y="-935.2" font-family="Arial" font-size="14.00" fill="#666666">[timestamp with time zone[]]</text>
<text text-anchor="start" x="264.82" y="-935.2" font-family="Arial" font-size="14.00"> The day&#39;s bookable start times when refreshed, in order (first_at is the first, last_at the last). Search takes the earliest at or after now plus the notice, the time the panel would show.</text>
<polygon fill="none" stroke="black" stroke-width="3" points="44.7,-921.5 44.7,-1124.5 2095.01,-1124.5 2095.01,-921.5 44.7,-921.5"/>
