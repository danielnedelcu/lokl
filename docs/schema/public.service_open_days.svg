<text text-anchor="start" x="914.39" y="-1100.8" font-family="Arial Bold" font-size="18.00">public.service_open_days</text>
<text text-anchor="start" x="1100.83" y="-1100.8" font-family="Arial" font-size="14.00">    </text>
<text text-anchor="start" x="1131.95" y="-1100.8" font-family="Arial" font-size="14.00" fill="#666666">[BASE TABLE]</text>
<text text-anchor="start" x="53.2" y="-1086.4" font-family="Arial" font-size="14.00" fill="#333333">Each market day a Service has a bookable time, with its start times (and the first and last of them), as of its last refresh (service_open_days_refreshed). Worked out by the slot core; only refresh_service_open_days writes it. Search reads it through service_open_matches. Derived data: rewritten freely, and deleted with its listing.</text>
<polygon fill="none" stroke="black" points="46.2,-1046.2 46.2,-1077 2093.51,-1077 2093.51,-1046.2 46.2,-1046.2"/>
