<text text-anchor="start" x="99.1" y="-966" font-family="Arial" font-size="14.00" fill="#666666">[timestamp with time zone]</text>
<polygon fill="none" stroke="black" points="46.2,-923 46.2,-953.8 1970.59,-953.8 1970.59,-923 46.2,-923"/>
<text text-anchor="start" x="53.2" y="-935.2" font-family="Arial" font-size="14.00">last_at </text>
<text text-anchor="start" x="98.34" y="-935.2" font-family="Arial" font-size="14.00" fill="#666666">[timestamp with time zone]</text>
<text text-anchor="start" x="264.06" y="-935.2" font-family="Arial" font-size="14.00"> The day&#39;s last bookable time when refreshed. Search checks it against now plus the notice, so a day whose times have all come within the notice no longer matches.</text>
