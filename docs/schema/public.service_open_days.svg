<text text-anchor="start" x="1039.37" y="-1070" font-family="Arial" font-size="14.00">    </text>
<text text-anchor="start" x="1070.49" y="-1070" font-family="Arial" font-size="14.00" fill="#666666">[BASE TABLE]</text>
<text text-anchor="start" x="53.2" y="-1055.6" font-family="Arial" font-size="14.00" fill="#333333">Each market day a Service has a bookable time, with the first and last of them, as of its last refresh (service_open_days_refreshed). Worked out by the slot core; only refresh_service_open_days writes it. Search reads it through service_open_matches. Derived data: rewritten freely, and deleted with its listing.</text>
<polygon fill="none" stroke="black" points="46.2,-1015.4 46.2,-1046.2 1970.59,-1046.2 1970.59,-1015.4 46.2,-1015.4"/>
