<text text-anchor="start" x="139.7" y="-607" font-family="Arial" font-size="14.00" fill="#333333">A problem a provider reported to lokl. Never deleted, and its details never change: only its status moves (on the admin&#39;s board, by a reply, or by the provider&#39;s &quot;This is sorted&quot;), with the columns its triggers keep.</text>
