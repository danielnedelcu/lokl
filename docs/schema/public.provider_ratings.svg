<text text-anchor="start" x="156.03" y="-607" font-family="Arial" font-size="14.00" fill="#333333">A business or host that sells Services or Experiences. One per login (owner_id is unique). Never deleted: bookings and payouts will point here, so a provider is suspended instead.</text>
