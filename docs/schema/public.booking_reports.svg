<text text-anchor="start" x="121.79" y="-856.2" font-family="Arial" font-size="14.00"> pending_payment (in Stripe Checkout; spots held until reserved_until) &#45;&gt; requested (Service: card on hold, waiting for the provider) &#45;&gt; confirmed (accepted and charged, or Experience paid) &#45;&gt; completed (it happened) &#45;&gt; paid_out (provider&#39;s share transferred). Or declined, expired, cancelled. A customer&#39;s late cancellation (no refund) can still be paid out. The allowed changes are enforced by bookings_guard.</text>
